name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Prepare a draft CLI release (e.g. v0.1.0); leave empty for CI artifacts only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: '1.98.0'
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: X64
            rustflags: ''
          - platform: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            arch: X64
            rustflags: '-C target-feature=+crt-static'
          - platform: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
            arch: ARM64
            rustflags: ''
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify native architecture and install Rust
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target "$BUILD_TARGET" --no-self-update
          rustc --version --verbose
          cargo --version

      - name: Test release packaging and tag verification
        run: python -B -m unittest discover -s scripts -p 'test_*release*.py' -v

      - name: Build release executable
        run: cargo build --locked --release --package mapac --target "$BUILD_TARGET"

      - name: Test PCM container exports
        run: |
          binary="target/$BUILD_TARGET/release/mapac"
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          MAPAC_BINARY="$binary" python -B -m unittest discover -s scripts -p 'test_pcm_output.py' -v

      - name: Test workspace
        run: cargo test --locked --release --workspace --target "$BUILD_TARGET" --no-fail-fast

      - name: Clippy
        run: cargo clippy --locked --release --workspace --all-targets --target "$BUILD_TARGET" -- -D warnings

      - name: Package executable, documentation and licenses
        run: |
          release_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            release_args+=(--release-tag "$RELEASE_TAG")
          fi
          python -B scripts/package_release.py --target "$BUILD_TARGET" --commit "$GITHUB_SHA" --out artifacts/release "${release_args[@]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapac-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Prepare CLI release draft
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: cli-release-${{ github.repository }}-${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify all three platform packages
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts/release --pattern 'mapac-*'
          assets=()
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            extension=tar.gz
            if [[ "$target" == x86_64-pc-windows-msvc ]]; then extension=zip; fi
            archive="mapac-${RELEASE_TAG}-${target}.${extension}"
            directory="artifacts/release/mapac-${target}"
            (cd "$directory" && sha256sum --check "$archive.sha256")
            assets+=("$directory/$archive" "$directory/$archive.sha256")
          done
          python3 -B scripts/verify_release_tag.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          release_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_args+=(--prerelease); fi
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo '::error::Refusing to replace a published release.'
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "mapac $RELEASE_TAG" \
              --notes-file "guide/releases/$RELEASE_TAG.md" "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --title "mapac $RELEASE_TAG" \
              --notes-file "guide/releases/$RELEASE_TAG.md" "${release_args[@]}"
          fi
