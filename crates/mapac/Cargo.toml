[package]
name = "mapac"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable Apple Positional Audio Codec decoder and inspection CLI"

[features]
# On by default; `--no-default-features` builds a tool without CAC inverse mixing, which
# rejects frames that use a nonzero CAC gain index.
default = ["cac"]
cac = ["apac-core/cac", "apac-research/cac"]

[[bin]]
name = "mapac"
path = "src/main.rs"

[dependencies]
apac-core.workspace = true
apac-research = { workspace = true, features = ["clap"] }
clap.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apac-native.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
